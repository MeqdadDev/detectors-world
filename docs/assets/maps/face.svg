<circle cx="418" cy="245" r="15" fill="#0d3934" stroke="#ffffff" stroke-width="2"/><text x="418" y="250" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="418" y="279" font-size="15" fill="#0d3934" text-anchor="middle" font-weight="400">Left ear tragion</text>
